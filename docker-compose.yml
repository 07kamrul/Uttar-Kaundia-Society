services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Right-sized for a small VPS (~2-4 GB total RAM). shared_buffers ~25% of
    # the memory we grant this container; work_mem is PER sort/hash operation,
    # so keep it low and raise per-query only if a specific report needs it.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=60
      -c wal_buffers=8MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaundia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaundia}
      POSTGRES_DB: ${POSTGRES_DB:-kaundia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaundia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Hard ceiling so Postgres can never starve the host; memswap_limit equals
    # mem_limit so Postgres does not swap silently and stall requests.
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 64mb

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kaundia}:${POSTGRES_PASSWORD:-kaundia}@postgres:5432/${POSTGRES_DB:-kaundia}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret}
      # Must point inside the backend_uploads volume or files are lost on redeploy
      STORAGE_BASE_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Kaundia Member Registry <no-reply@example.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_NOTIFY_EMAILS: ${ADMIN_NOTIFY_EMAILS:-anshintech07@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:2001}
    ports:
      - "2000:2000"
    volumes:
      - backend_uploads:/app/uploads
    # Migrations + seed run in scripts/entrypoint.sh before this command.
    command: >
      sh -c "(python -m scripts.repair_document_paths --apply || true) &&
             uvicorn app.main:app --host 0.0.0.0 --port 2000 --workers 1"
    # Single worker is intentional for the VPS RAM budget; each additional
    # worker is a full Python process. Raise together with mem_limit.
    mem_limit: 768m
    memswap_limit: 768m

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "2001:2001"
    mem_limit: 128m
    memswap_limit: 128m

volumes:
  postgres_data:
  backend_uploads:
