name: kaundia_app
description: Uttar Kaundia Abashon Malik Kalyan Society - member registry mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.0
  dio: ^5.7.0
  go_router: ^14.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  mime: ^2.0.0
  url_launcher: ^6.3.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  phone_numbers_parser: ^9.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo.jpeg
