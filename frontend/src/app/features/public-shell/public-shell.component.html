<div class="public-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-header-brand" routerLink="/" (click)="$event.preventDefault(); goHome()">
        <div class="brand-mark">
          <img src="/images/logo.jpeg" [attr.alt]="'brand.name' | translate" class="brand-mark-logo" />
        </div>
        <div>
          <div class="site-header-brand-name">{{ 'brand.name' | translate }}</div>
          <div class="site-header-brand-org">{{ 'brand.org' | translate }}</div>
        </div>
      </a>
      <div class="site-header-actions" [class.is-open]="isMobileMenuOpen" id="site-header-actions">
        <a routerLink="/notices" class="btn btn-ghost btn-sm" (click)="closeMobileMenu()">{{
          'nav.notices' | translate
        }}</a>
        <a routerLink="/events" class="btn btn-ghost btn-sm" (click)="closeMobileMenu()">{{
          'nav.events' | translate
        }}</a>
        <a routerLink="/register" class="btn btn-ghost btn-sm" (click)="closeMobileMenu()">{{
          'nav.register' | translate
        }}</a>
        <a routerLink="/login" class="btn btn-ghost btn-sm" (click)="closeMobileMenu()">{{
          'nav.login' | translate
        }}</a>
        <button
          type="button"
          class="btn btn-ghost btn-sm"
          [title]="'nav.changeTheme' | translate"
          (click)="theme.toggle()"
          [attr.aria-label]="(theme.theme() === 'dark' ? 'nav.lightTheme' : 'nav.darkTheme') | translate"
        >
          <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="16" />
        </button>
        @if (fiveAreas) {
          <app-lang-switch />
        } @else {
        <button
          type="button"
          class="btn btn-ghost btn-sm"
          (click)="lang.toggle()"
          [attr.aria-label]="(lang.lang() === 'bn' ? 'common.switchToEnglish' : 'common.switchToBangla') | translate"
          [title]="(lang.lang() === 'bn' ? 'common.switchToEnglish' : 'common.switchToBangla') | translate"
        >
          {{ lang.lang() === 'bn' ? 'EN' : 'অ-A' }}
        </button>
        }
      </div>
      <button
        type="button"
        class="site-header-menu-toggle btn btn-ghost btn-sm"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="site-header-actions"
        [attr.aria-label]="(isMobileMenuOpen ? 'nav.closeMenu' : 'nav.openMenu') | translate"
      >
        <app-icon [name]="isMobileMenuOpen ? 'close' : 'menu'" [size]="20" />
      </button>
    </div>
    <div class="gold-rule"></div>
    @if (isMobileMenuOpen) {
      <div class="site-header-backdrop" (click)="closeMobileMenu()"></div>
    }
  </header>
  <app-net-status-banner />

  <main class="public-shell-content">
    <router-outlet />
  </main>

  <footer class="site-footer">
    {{ 'footer.publicNotice' | translate }}
  </footer>
</div>
