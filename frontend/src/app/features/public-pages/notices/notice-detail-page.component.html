<div class="public-page">
  <a routerLink="/notices" class="btn btn-ghost btn-sm" style="margin-bottom: 1rem">
    ← {{ 'notices.backToList' | translate }}
  </a>

  @if (loading) {
    <app-section-loader variant="form" [count]="3" />
  } @else if (notFound || !notice) {
    <div class="card empty-state">{{ 'notices.notFound' | translate }}</div>
  } @else {
    <article class="card">
      <div
        style="
          display: flex;
          gap: 0.75rem;
          flex-wrap: wrap;
          align-items: center;
          margin-bottom: 0.5rem;
        "
      >
        @if (categoryLabel) {
          <span class="ds-badge ds-badge-blue">{{ categoryLabel }}</span>
        }
        <span style="color: var(--gray-600); font-size: 0.85rem">
          {{ notice.publishAt ?? notice.createdAt | date: 'MMMM d, y' }}
        </span>
      </div>
      <h1 class="page-title" style="margin-bottom: 0.75rem">{{ notice.title }}</h1>
      <p style="white-space: pre-line; margin: 0; line-height: 1.7">{{ notice.body }}</p>
    </article>
  }
</div>
